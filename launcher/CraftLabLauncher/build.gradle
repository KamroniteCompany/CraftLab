plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.craftlab'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls']
}

application {
    // Launcher, PAS CraftLabLauncherApp directement : voir la javadoc de Launcher pour la
    // raison exacte (Main-Class ne doit jamais être un sous-type de javafx.application.Application
    // pour un jar/exe packagé, sous peine de "Error: JavaFX runtime components are missing").
    mainClass = 'com.craftlab.launcher.Launcher'
}

// Expose `version` (déclaré ci-dessus) via le manifeste du JAR, pour que AppVersion puisse le
// lire à l'exécution (getClass().getPackage().getImplementationVersion()) au lieu qu'un numéro
// de version soit recopié à la main quelque part dans le code.
jar {
    manifest {
        attributes(
            'Implementation-Title': 'CraftLab Launcher',
            'Implementation-Version': project.version,
            // Launcher, PAS CraftLabLauncherApp : voir la javadoc de Launcher. Permet aussi
            // `java -jar craftlab-launcher-X.Y.Z.jar` de fonctionner directement (à condition que
            // les jars JavaFX/Gson soient sur le classpath, ex. via -cp en plus de -jar, puisque
            // Class-Path n'est pas généré ici — utiliser installDist pour un lancement autonome).
            'Main-Class': 'com.craftlab.launcher.Launcher'
        )
    }
}

// UUID fixe (généré une seule fois, le 2026-08-31) : jpackage/WiX s'en sert pour reconnaître
// qu'une future installation est une MISE À JOUR de celle-ci, pas une application différente.
// Ne JAMAIS le régénérer une fois un premier installeur distribué, sous peine de casser les
// mises à jour en place pour les utilisateurs existants (ils se retrouveraient avec deux entrées
// dans "Applications et fonctionnalités").
ext.winUpgradeUuid = 'd28717a0-496b-49e4-a508-b8d8166c69f5'

/**
 * Construit un runtime Java (jlink) embarquant TOUS les modules du JDK, au lieu d'une liste
 * restreinte calculée via jdeps.
 *
 * Tentative initiale (2026-08-31) : une liste de modules calculée via `jdeps --print-module-deps`
 * contre le jar du launcher + ses dépendances (java.base/java.desktop/java.net.http/java.sql/
 * jdk.jfr/jdk.unsupported, + jdk.crypto.ec/jdk.crypto.mscapi/jdk.zipfs ajoutés à la main pour les
 * fournisseurs chargés via ServiceLoader que jdeps ne voit pas). Cette liste ne couvrait que les
 * besoins du LAUNCHER lui-même — mais ce même runtime sert aussi à lancer Minecraft/Forge (voir
 * MinecraftLauncher.resolveJavaExecutable()), dont les besoins sont fondamentalement différents
 * et impossibles à énumérer à l'avance : Forge/Mixin utilisent le module system Java avec leurs
 * propres `requires` (ex. `java.compiler`, requis par org.spongepowered.mixin — absent de la
 * liste calculée, provoquant "Module java.compiler not found" au clic sur "Jouer", constaté en
 * conditions réelles). Pire : n'importe quel MOD tiers pourrait un jour exiger n'importe quel
 * autre module JDK, ce qui rend toute liste figée intrinsèquement fragile pour ce cas d'usage
 * précis (contrairement à une application "fermée" dont les dépendances sont enitèrement connues
 * à la compilation).
 *
 * D'où ALL-MODULE-PATH : fonctionnellement équivalent au JDK complet (aucun risque de module
 * manquant, quel que soit le mod installé), tout en restant plus léger que le JDK brut grâce à
 * --no-header-files/--no-man-pages/--compress (~96 Mo contre 149 Mo, mesuré). Sans
 * --strip-native-commands (contrairement au runtime que jpackage construit lui-même par défaut) :
 * java.exe/javaw.exe DOIVENT rester présents dans runtime/bin/, sans quoi MinecraftLauncher n'a
 * plus de JVM générique à relancer pour Minecraft une fois packagé (bug réel constaté le
 * 2026-08-31 : cliquer "Jouer" rouvrait le launcher lui-même à la place).
 */
tasks.register('jlinkRuntime', Exec) {
    group = 'distribution'
    description = 'Construit le runtime Java (jlink, tous modules) embarqué par jpackageWindows.'

    def javaLauncher = javaToolchains.launcherFor(java.toolchain).get()
    def javaHome = javaLauncher.metadata.installationPath.asFile
    def jlinkExecutable = new File(javaHome, 'bin/jlink.exe')
    def jmodsDir = new File(javaHome, 'jmods')
    def outputDir = layout.buildDirectory.dir('runtime-image').get().asFile

    outputs.dir(outputDir)

    doFirst {
        if (!jlinkExecutable.exists()) {
            throw new GradleException("jlink introuvable : ${jlinkExecutable}.")
        }
        if (!jmodsDir.exists()) {
            throw new GradleException("jmods introuvable : ${jmodsDir}. "
                + "Le toolchain Java 21 configuré doit être un JDK complet (un JRE seul n'a pas de jmods).")
        }
        // jlink refuse d'écrire dans un dossier déjà existant, même vide.
        delete(outputDir)
    }

    commandLine(
        jlinkExecutable.absolutePath,
        '--module-path', jmodsDir.absolutePath,
        '--add-modules', 'ALL-MODULE-PATH',
        '--output', outputDir.absolutePath,
        '--no-header-files',
        '--no-man-pages',
        '--compress=2'
    )
}

/**
 * Produit un installeur Windows (.exe, via WiX/jpackage) qui embarque le runtime jlink réduit
 * ci-dessus (aucune dépendance à un Java déjà installé chez le joueur). Dépend de installDist
 * (tâche standard du plugin 'application') pour obtenir un dossier lib/ contenant le jar du
 * launcher et toutes ses dépendances resolues (Gson, JavaFX pour l'OS courant) — c'est exactement
 * le dossier attendu par jpackage en mode --input (application non modulaire).
 */
tasks.register('jpackageWindows', Exec) {
    dependsOn tasks.named('installDist'), tasks.named('jlinkRuntime')
    group = 'distribution'
    description = 'Génère CraftLab-Launcher-<version>.exe (installeur Windows, JRE embarqué).'

    def javaLauncher = javaToolchains.launcherFor(java.toolchain).get()
    def javaHome = javaLauncher.metadata.installationPath.asFile
    def jpackageExecutable = new File(javaHome, 'bin/jpackage.exe')
    def libDir = layout.buildDirectory.dir('install/craftlab-launcher/lib')
    def runtimeImageDir = layout.buildDirectory.dir('runtime-image')
    def outputDir = layout.buildDirectory.dir('jpackage')
    def iconFile = file('packaging/craftlab-launcher.ico')

    inputs.dir(libDir)
    inputs.dir(runtimeImageDir)
    inputs.file(iconFile)
    outputs.dir(outputDir)

    doFirst {
        if (!jpackageExecutable.exists()) {
            throw new GradleException("jpackage introuvable : ${jpackageExecutable}. "
                + "Le toolchain Java 21 configuré doit être un JDK complet (jpackage n'existe pas dans un JRE seul).")
        }
        if (!iconFile.exists()) {
            throw new GradleException("Icône introuvable : ${iconFile}.")
        }
        outputDir.get().asFile.mkdirs()
    }

    commandLine(
        jpackageExecutable.absolutePath,
        '--type', 'exe',
        '--name', 'CraftLab Launcher',
        '--app-version', project.version.toString(),
        '--vendor', 'KamroniteCompany',
        '--description', 'Launcher officiel du serveur CraftLab',
        '--copyright', 'KamroniteCompany',
        '--icon', iconFile.absolutePath,
        '--input', libDir.get().asFile.absolutePath,
        '--runtime-image', runtimeImageDir.get().asFile.absolutePath,
        '--main-jar', "craftlab-launcher-${project.version}.jar",
        // Launcher, PAS CraftLabLauncherApp : voir sa javadoc pour la raison exacte
        // ("Error: JavaFX runtime components are missing" reproduit et corrigé le 2026-08-31).
        '--main-class', 'com.craftlab.launcher.Launcher',
        '--dest', outputDir.get().asFile.absolutePath,
        '--win-shortcut',
        '--win-menu',
        '--win-per-user-install',
        '--win-upgrade-uuid', winUpgradeUuid
    )
}

repositories {
    mavenCentral()
}

dependencies {
    // Même bibliothèque JSON que le serveur CraftLab, pour rester cohérent — mais ici en
    // dépendance explicite : ce projet n'est plus un mod Forge, Gson n'est pas fourni
    // transitivement par Minecraft.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}
