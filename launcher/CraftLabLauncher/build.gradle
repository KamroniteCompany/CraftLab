plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.craftlab'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.craftlab.launcher.CraftLabLauncherApp'
}

// Expose `version` (déclaré ci-dessus) via le manifeste du JAR, pour que AppVersion puisse le
// lire à l'exécution (getClass().getPackage().getImplementationVersion()) au lieu qu'un numéro
// de version soit recopié à la main quelque part dans le code.
jar {
    manifest {
        attributes(
            'Implementation-Title': 'CraftLab Launcher',
            'Implementation-Version': project.version
        )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Même bibliothèque JSON que le serveur CraftLab, pour rester cohérent — mais ici en
    // dépendance explicite : ce projet n'est plus un mod Forge, Gson n'est pas fourni
    // transitivement par Minecraft.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}
