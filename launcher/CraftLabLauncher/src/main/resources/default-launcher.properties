# Configuration PAR DÉFAUT du CraftLab Launcher, embarquée dans le JAR (voir LauncherConfig).
#
# Ce fichier est la SEULE chose à modifier pour changer les valeurs qu'obtient un joueur qui
# lance le launcher pour la toute première fois - jamais un chemin ou une adresse codée en dur
# dans le code Java. Le fichier utilisateur (%APPDATA%\CraftLabLauncher\launcher.properties,
# créé/modifié par le joueur) prend toujours le dessus, clé par clé, sur ce qui est écrit ici :
# voir LauncherConfig.load(), qui charge ce fichier comme `defaults` d'un java.util.Properties
# avant de charger celui de l'utilisateur par-dessus.
#
# Aucune valeur ici ne doit dépendre d'une machine ou d'un compte utilisateur particulier.

modpack_url=file:./current-modpack-launcher.json
server_address=localhost
server_port=25565
username=Player
resolution_width=1280
resolution_height=720
